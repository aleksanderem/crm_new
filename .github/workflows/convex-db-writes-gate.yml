name: Convex DB Writes Gate

# Forbids ctx.db.insert, ctx.db.patch, and ctx.db.delete on any table listed
# in TABLE_MAP in convex/_helpers/supabaseDb.ts. Those tables are owned by
# Supabase; writing them via ctx.db creates rows the Supabase side will never
# see and bypasses all Supabase write-path invariants.
# Fails if any non-whitelisted file introduces such a write.
# See scripts/check-convex-db-writes.mjs and issue #4943.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  convex-db-writes-gate:
    name: check:convex-db-writes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check no ctx.db.insert/patch/delete on TABLE_MAP tables
        run: npm run check:convex-db-writes
