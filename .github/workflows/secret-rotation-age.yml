name: Secret Rotation Age Check

# Ensures all 90-day secrets are rotated within the target window.
# Uses the GitHub REST API to read updated_at for each secret — the API
# returns metadata only, never the secret value.
#
# Permissions: secrets:read on GITHUB_TOKEN (declared below) allows calling
# GET /repos/{owner}/{repo}/actions/secrets/{name} which returns name,
# created_at, and updated_at without exposing the encrypted value.
#
# Threshold: warns at >75 days, fails at ≥90 days.
# See docs/secrets.md for rotation procedures.

on:
  schedule:
    # Daily at 08:00 UTC (~10:00 Europe/Warsaw). Runs after secrets-health.yml
    # (07:00) so any morning triage sees both checks together.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  secrets: read

jobs:
  check-rotation-age:
    name: Verify 90-day secret rotation age
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret ages via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          MAX_AGE_DAYS=90
          WARN_AGE_DAYS=75

          # Full list of secrets with a 90-day rotation target.
          # Source of truth: docs/secrets.md — "Rotation schedule" table.
          SECRETS=(
            SUPABASE_DB_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_JWT_SECRET
            CONVEX_DEPLOY_KEY
            NETLIFY_AUTH_TOKEN
            BACKUP_AWS_ACCESS_KEY_ID
            BACKUP_AWS_SECRET_ACCESS_KEY
          )

          now=$(date +%s)
          warn=()
          overdue=()

          for secret in "${SECRETS[@]}"; do
            updated_at=$(gh api "repos/${REPO}/actions/secrets/${secret}" \
              --jq '.updated_at' 2>/dev/null || true)

            if [ -z "${updated_at:-}" ]; then
              echo "::warning::${secret} — not found or inaccessible; skipping age check"
              continue
            fi

            updated_ts=$(date -d "${updated_at}" +%s)
            age_days=$(( (now - updated_ts) / 86400 ))

            if [ "${age_days}" -ge "${MAX_AGE_DAYS}" ]; then
              overdue+=("${secret} (${age_days}d since last update)")
              echo "::error::${secret} — OVERDUE: last updated ${age_days} days ago (target: ≤${MAX_AGE_DAYS} days)"
            elif [ "${age_days}" -ge "${WARN_AGE_DAYS}" ]; then
              warn+=("${secret} (${age_days}d, due in $((MAX_AGE_DAYS - age_days))d)")
              echo "::warning::${secret} — last updated ${age_days} days ago — rotation due in $((MAX_AGE_DAYS - age_days)) day(s)"
            else
              echo "✓ ${secret}: ${age_days}d — OK"
            fi
          done

          echo ""

          if [ "${#overdue[@]}" -gt 0 ]; then
            echo "::error::${#overdue[@]} secret(s) overdue for rotation:"
            for s in "${overdue[@]}"; do
              echo "::error::  • ${s}"
            done
            echo "::error::Rotate via docs/secrets.md → Rotation procedures, then re-run this workflow."
            exit 1
          fi

          if [ "${#warn[@]}" -gt 0 ]; then
            echo "::warning::${#warn[@]} secret(s) approaching rotation deadline:"
            for s in "${warn[@]}"; do
              echo "::warning::  • ${s}"
            done
          fi

          echo "All 90-day secrets are within the rotation window."
