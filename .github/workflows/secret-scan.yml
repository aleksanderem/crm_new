name: Secret scan (gitleaks)

# Scans the full git history for accidentally committed secrets.
# Runs on every push to main, every PR against main, and weekly on Sunday.
#
# A failure means a secret pattern was found in history.
# See docs/secrets.md § "Git history leak response" for the response procedure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Sunday at 06:00 UTC (before the daily secrets-health check)
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  scan:
    name: Gitleaks — scan git history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required to scan the complete git history.
          # A shallow clone would only see the most recent commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for the Action on private repos to
          # avoid rate-limiting. Set it as a repo secret if you see 403 errors.
          # Free for open source / public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
