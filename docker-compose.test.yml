version: "3.8"
services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: crm_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d crm_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data  # ephemeral — no persistent volume needed for tests
